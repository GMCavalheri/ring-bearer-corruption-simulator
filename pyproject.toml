[project]
name = "ring-bearer-corruption"
version = "1.0.0"
description = "ODE/SDE model of how ring-bearers fall: bifurcation, Monte Carlo and survival analysis."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Milanez Cavalheri" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.36",
    "lifelines>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "nbmake>=1.5",
    "ipykernel>=6.29",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corruption"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
# Greek-letter math names (W, A, C) mirror the paper notation.
ignore = ["N803", "N806", "N815", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "lifelines.*", "plotly.*", "streamlit.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["corruption"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
