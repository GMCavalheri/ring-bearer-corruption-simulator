name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Unit tests with coverage gate
        run: >
          uv run pytest tests/unit
          --cov=corruption --cov-report=term --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit-unit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-unit-py${{ matrix.python-version }}
          path: reports/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Dependency audit
        run: |
          uv export --no-emit-project --all-groups --format requirements-txt -o requirements-audit.txt -q
          uvx pip-audit -r requirements-audit.txt --disable-pip --strict
